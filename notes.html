<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人笔记</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/11.3.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>
    <style>
        .note-item {
            margin: 10px 0;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            cursor: pointer;
        }
        #noteInput {
            padding: 8px;
            margin-right: 10px;
            width: 300px;
        }
        button {
            padding: 8px 15px;
            background-color: #0047AB;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>📌 我的笔记</h2>
    <div>
        <input type="text" id="noteInput" placeholder="输入你的笔记...">
        <button onclick="addNote()">添加笔记</button>
    </div>
    <div id="notesList"></div>

    <script>
        // 读取笔记
        function loadNotes() {
            const notesList = document.getElementById("notesList");
            notesList.innerHTML = "";
            
            db.collection("notes")
                .orderBy("timestamp", "desc")
                .onSnapshot((snapshot) => {
                    notesList.innerHTML = "";
                    snapshot.forEach((doc) => {
                        const noteData = doc.data();
                        const noteItem = document.createElement("div");
                        noteItem.classList.add("note-item");
                        noteItem.innerHTML = `
                            <span>${noteData.content}</span>
                            <span class="delete-btn" onclick="deleteNote('${doc.id}')">❌</span>
                        `;
                        notesList.appendChild(noteItem);
                    });
                });
        }

        // 添加笔记
        function addNote() {
            const noteInput = document.getElementById("noteInput");
            const noteText = noteInput.value.trim();
            
            if (noteText) {
                db.collection("notes").add({
                    content: noteText,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                })
                .then(() => {
                    noteInput.value = "";
                })
                .catch((error) => {
                    console.error("Error adding note: ", error);
                    alert("添加笔记失败，请重试");
                });
            }
        }

        // 删除笔记
        function deleteNote(noteId) {
            db.collection("notes").doc(noteId).delete()
                .catch((error) => {
                    console.error("Error removing note: ", error);
                    alert("删除笔记失败，请重试");
                });
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', loadNotes);
    </script>
</body>
</html>
